$kind: http-request
url: "{{base_url}}/api/v1/outlets/{{outlet_id}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Updated Andheri Supermarket"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      pm.test('Name was updated', function () { pm.expect(pm.response.json().name).to.eql('Updated Andheri Supermarket'); });
    language: text/javascript
order: 5000
