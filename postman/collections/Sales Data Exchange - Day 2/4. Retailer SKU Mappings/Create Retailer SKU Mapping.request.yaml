$kind: http-request
url: "{{base_url}}/api/v1/retailer-product-mappings"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "retailer_id": "{{retailer_id}}",
      "retailer_sku": "SOAP-DOVE-{{run_suffix}}",
      "product_id": "{{product_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', function () { pm.response.to.have.status(201); });
      const body = pm.response.json();
      pm.collectionVariables.set('mapping_id', body.id);
      pm.test('Mapping points to created product', function () { pm.expect(body.product_id).to.eql(pm.collectionVariables.get('product_id')); });
    language: text/javascript
order: 1000
