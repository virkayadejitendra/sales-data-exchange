$kind: http-request
url: "{{base_url}}/api/v1/retailer-product-mappings/{{mapping_id}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "retailer_sku": "SOAP-DOVE-UPD-{{run_suffix}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      pm.test('Retailer SKU was updated', function () { pm.expect(pm.response.json().retailer_sku).to.include('SOAP-DOVE-UPD-'); });
    language: text/javascript
order: 5000
